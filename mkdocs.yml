site_name: Muxiva Documentation
site_description: Real-time multimodal agent runtime for Rust, C++, Python, and TypeScript
site_url: https://piyotahu.github.io/muxiva/
repo_url: https://github.com/PiyotaHu/muxiva
repo_name: PiyotaHu/muxiva
docs_dir: docs/site
edit_uri: edit/main/docs/site/
copyright: Copyright &copy; 2026 Muxiva contributors

theme:
  name: material
  language: en
  logo: assets/brand/muxiva-logo.png
  favicon: assets/brand/muxiva-logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: Muxiva Documentation
          site_description: Real-time multimodal agent runtime for Rust, C++, Python, and TypeScript
        - locale: zh
          name: 简体中文
          build: true
          site_name: Muxiva 文档
          site_description: 面向 Rust、C++、Python 与 TypeScript 的实时多模态 Agent Runtime
          nav_translations:
            Home: 首页
            Get started: 快速开始
            Installation and first run: 安装与首次运行
            Flagship voice demo: 旗舰语音 Demo
            Voice credentials checklist: 语音凭据清单
            Remote and headless Linux: 远程与无 GUI Linux
            Studio: Studio 可视化开发
            Observability: 可观测性与堵点定位
            Core concepts: 核心概念
            System overview: 系统全景
            Rust Core model: Rust Core 模型
            Graph and typed ports: Graph 与类型化端口
            Real-time flow and control: 实时流控与控制
            Node extensibility: Node 扩展机制
            Multi-language execution: 多语言执行
            Node architecture: Node 架构
            CLI, Studio, and web: CLI、Studio 与 Web
            End-to-end voice path: 端到端语音链路
            Developer manual: 开发手册
            Manual overview: 手册概览
            Agent integration: Agent 集成
            Pi coding Agent: Pi 编码 Agent
            Node packages: Node Package
            Python: Python
            TypeScript: TypeScript
            Rust: Rust
            C++: C++
            Integrations: 集成
            Official and custom Nodes: 官方与自定义 Node
            Node catalog: Node 目录
            Overview: 概览
            Built-in Nodes: 内置 Node
            Agora RTC: Agora RTC
            Audio ingress: 音频输入
            Audio egress: 音频输出
            Qwen algorithms: Qwen 算法
            Audio Realtime: 实时语音
            Streaming ASR: 流式 ASR
            Streaming LLM: 流式 LLM
            Streaming TTS: 流式 TTS
            Quality: 质量保障
            Testing: 测试体系
            Project: 项目
            Status and roadmap: 状态与路线图
            Contributing: 参与贡献

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Installation and first run: getting-started.md
      - Voice credentials checklist: voice-credentials.md
      - Flagship voice demo: voice-demo.md
      - Remote and headless Linux: remote-studio.md
      - Studio: studio.md
      - Observability: observability.md
  - Core concepts:
      - System overview: concepts.md
      - Rust Core model: core-runtime.md
      - Graph and typed ports: graph.md
      - Real-time flow and control: realtime-control.md
      - Node extensibility: extensibility.md
      - Multi-language execution: languages.md
      - Node architecture: provider-architecture.md
      - CLI, Studio, and web: developer-surfaces.md
      - End-to-end voice path: voice-architecture.md
  - Developer manual:
      - Manual overview: nodes/index.md
      - Agent integration: nodes/agent-integration.md
      - Pi coding Agent: nodes/pi-agent.md
      - Python: nodes/python.md
      - TypeScript: nodes/typescript.md
      - Rust: nodes/rust.md
      - C++: nodes/cpp.md
  - Integrations:
      - Official and custom Nodes: integrations.md
      - Node catalog:
          - Overview: providers/index.md
          - Built-in Nodes: providers/builtin.md
          - Agora RTC:
              - Overview: providers/agora/index.md
              - Audio ingress: providers/agora/audio-ingress.md
              - Audio egress: providers/agora/audio-egress.md
              - Realtime messages: providers/agora/realtime-messages.md
          - Qwen algorithms:
              - Overview: providers/qwen/index.md
              - Audio Realtime: providers/qwen/audio-realtime.md
              - Streaming ASR: providers/qwen/asr-realtime.md
              - Streaming LLM: providers/qwen/llm-stream.md
              - Streaming TTS: providers/qwen/tts-realtime.md
  - Quality:
      - Testing: testing.md
  - Project:
      - Status and roadmap: roadmap.md
      - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PiyotaHu/muxiva
  generator: true
