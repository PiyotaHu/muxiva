[workspace]
members = [
    "crates/voxa-core",
    "crates/voxa-examples",
    "crates/voxa-ffi",
    "crates/voxa-graph-json",
    "crates/voxa-cli",
    "crates/voxa-studio",
    "crates/voxa-bench",
    "crates/voxa-testkit",
    "crates/voxa-node",
    "crates/voxa-python",
    "crates/voxa-types",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libloading = "0.8.9"
voxa-types = { path = "crates/voxa-types", version = "0.1.0" }
