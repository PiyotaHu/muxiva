name: native-ffi

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - run: ./scripts/check-ffi.sh
      - run: ./scripts/check-rtc.sh
      - run: ./scripts/check-media.sh
