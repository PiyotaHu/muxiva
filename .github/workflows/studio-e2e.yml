name: studio-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/muxiva-studio/**"
      - "scripts/check-studio-e2e.sh"
      - ".github/workflows/studio-e2e.yml"

jobs:
  studio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - run: ./scripts/check-studio-e2e.sh

