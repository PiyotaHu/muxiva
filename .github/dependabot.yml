version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      napi-runtime:
        patterns: ["napi", "napi-derive", "napi-build"]
        update-types: ["minor", "patch"]
      rust-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    groups:
      node-bindings:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/examples/typescript"
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Shanghai
    groups:
      documentation:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/crates/voxa-python"
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Shanghai
    groups:
      python-build:
        patterns: ["*"]
    ignore:
      - dependency-name: maturin
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
