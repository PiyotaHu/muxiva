name: bindings

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Provision Python build and test tools
        run: python -m pip install maturin==1.9.1 pytest==8.4.1
      - run: ./scripts/check-python.sh
        env:
          MUXIVA_PYTHON: python

  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Fetch Node dependencies explicitly
        working-directory: bindings/node
        run: pnpm fetch --frozen-lockfile
      - run: ./scripts/check-node.sh
      - name: Check out the pinned application Agent
        working-directory: examples/voice-agent
        run: |
          mkdir -p .muxiva/agents
          git clone --depth 1 --branch v0.1.2 https://github.com/PiyotaHu/muxiva-pi-agent.git .muxiva/agents/muxiva-pi-agent
      - name: Install locked Pi Agent dependencies without lifecycle scripts
        working-directory: examples/voice-agent
        run: npm ci --ignore-scripts
      - run: ./scripts/check-agent-typescript.sh
