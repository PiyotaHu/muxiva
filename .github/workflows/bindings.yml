name: bindings

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Provision Python build and test tools
        run: python -m pip install maturin==1.9.1 pytest==8.4.1
      - run: ./scripts/check-python.sh
        env:
          VOXA_PYTHON: python

  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Fetch Node dependencies explicitly
        working-directory: bindings/node
        run: pnpm fetch --frozen-lockfile
      - run: ./scripts/check-node.sh

