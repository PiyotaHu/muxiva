name: release-python

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Require one version across tag, Cargo, and Python metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release/check-release-identity.py --channel python
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          cargo = tomllib.loads((root / 'Cargo.toml').read_text())
          python = tomllib.loads((root / 'crates/muxiva-python/pyproject.toml').read_text())
          versions = {
              'tag': os.environ['RELEASE_TAG'].removeprefix('v'),
              'workspace': cargo['workspace']['package']['version'],
              'python': python['project']['version'],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f'release version mismatch: {versions}')
          print(f"release version verified: {versions['tag']}")
          PY

  wheels:
    needs: validate-version
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - runner: macos-14
            target: universal2-apple-darwin
            manylinux: auto
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Enable Linux ARM64 builds
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Build audited Linux wheel
        if: contains(matrix.platform.target, 'linux')
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.13.3
          working-directory: crates/muxiva-python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          # manylinux runs inside a container and must select its own exact
          # /opt/python interpreter; the setup-python host shim is not visible.
          args: --release --locked --compatibility pypi --out dist -i python${{ matrix.python }}
      - name: Build audited macOS or Windows wheel
        if: ${{ !contains(matrix.platform.target, 'linux') }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.13.3
          working-directory: crates/muxiva-python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --compatibility pypi --out dist -i python
      - name: Install and test the native wheel
        if: matrix.platform.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pytest==8.3.5; python_version < '3.9'" "pytest==8.4.1; python_version >= '3.9'"
          python -m pip install --disable-pip-version-check --no-index --find-links crates/muxiva-python/dist "muxiva==${GITHUB_REF_NAME#v}"
          python -m pytest -q crates/muxiva-python/tests
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-${{ matrix.python }}-${{ matrix.platform.target }}
          path: crates/muxiva-python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.13.3
          working-directory: crates/muxiva-python
          args: --out dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-sdist
          path: crates/muxiva-python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/muxiva/
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Inspect release payload
        run: |
          test "$(find dist -type f -name '*.whl' | wc -l | tr -d ' ')" = 28
          test "$(find dist -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 1
          find dist -type f -maxdepth 1 -print | sort
      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          verbose: true
      - name: Create checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - name: Attach Python distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
