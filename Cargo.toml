[workspace]
members = [
    "crates/muxiva-core",
    "crates/muxiva-examples",
    "crates/muxiva-ffi",
    "crates/muxiva-graph-json",
    "crates/muxiva-cli",
    "crates/muxiva-studio",
    "crates/muxiva-bench",
    "crates/muxiva-testkit",
    "crates/muxiva-node",
    "crates/muxiva-python",
    "crates/muxiva-types",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.3.0", features = ["json"] }
clap = { version = "4", features = ["derive"] }
libloading = "0.8.9"
muxiva-types = { path = "crates/muxiva-types", version = "0.1.0" }
